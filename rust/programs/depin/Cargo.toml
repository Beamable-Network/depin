[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic", "test"))'
]

[package]
name = "depin"
version = "0.1.0"
edition = "2021"

[dependencies]
borsh = "1.5.7"
depin-core = { path = "../../depin-core" }
mpl-bubblegum = "2.1.0"
solana-program = "2.2.1"
spl-associated-token-account = { version = "7.0.0", features = ["no-entrypoint"] }
spl-token = { version = "8.0.0", features = ["no-entrypoint"] }

[lib]
crate-type = ["cdylib", "lib"]

[features]
test = ["depin-core/test"]
