services:
  # OpenTelemetry Collector - receives traces and logs from your app
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4318:4318"   # OTLP HTTP receiver (this is what your app will use)
    networks:
      - otel-network

  # Jaeger v2 - simple UI to view traces
  jaeger:
    image: jaegertracing/jaeger:2.0.0
    container_name: jaeger
    command:
      - "--set"
      - "receivers.otlp.protocols.http.endpoint=0.0.0.0:4318"
      - "--set"
      - "receivers.otlp.protocols.grpc.endpoint=0.0.0.0:4317"
    ports:
      - "16686:16686" # Jaeger UI at http://localhost:16686
      - "4317:4317"   # OTLP gRPC receiver
    networks:
      - otel-network

networks:
  otel-network:
    driver: bridge
